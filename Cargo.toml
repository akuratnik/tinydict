[package]
name = "tinydict"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anton-expertstudio/tinydict"
description = "Tiny voice dictation Rust daemon for Linux."

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ksni = "0.3"
libc = "0.2"
listenfd = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.8"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
